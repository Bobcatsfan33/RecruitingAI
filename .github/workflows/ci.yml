name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            ruff \
            pytest \
            pytest-asyncio \
            httpx \
            fastapi \
            uvicorn \
            structlog \
            pydantic \
            pydantic-settings \
            asyncpg \
            redis \
            apscheduler \
            feedparser \
            clickhouse-connect

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: python
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build govcon-wfi image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/govcon-wfi/Dockerfile
          push: false
          tags: govcon-wfi:${{ github.sha }}
