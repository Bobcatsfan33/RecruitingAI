[project]
name = "wfi-events"
version = "0.1.0"
description = "ClickHouse + Redis Streams event publisher / consumer."
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.7.16",
    "redis[hiredis]>=5.0.7",
    "pydantic>=2.7",
    "wfi-schemas",
    "structlog>=24.4",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfi_events"]
