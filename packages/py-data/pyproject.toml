[project]
name = "wfi-data"
version = "0.1.0"
description = "Resume parsing, enrichment adapters, embedding generation."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.4",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "anthropic>=0.40.0",
    "wfi-schemas",
    "wfi-llm",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfi_data"]
