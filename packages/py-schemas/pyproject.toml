[project]
name = "wfi-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas for the Workforce Intelligence platform."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfi_schemas"]
