[project]
name = "wfi-rules-sdk"
version = "0.1.0"
description = "Client SDK for the rules service (OPA-backed)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfi_rules_sdk"]
