[project]
name = "wfi-llm"
version = "0.1.0"
description = "Model router + prompt-cached Anthropic client."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfi_llm"]
