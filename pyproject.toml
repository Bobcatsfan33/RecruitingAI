[project]
name = "govcon-workforce-intelligence"
version = "1.0.0"
description = "Contract intelligence + workforce gap analysis for GovCon services firms."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.uv.workspace]
members = [
    "services/govcon-wfi",
    "services/rules",
    "services/capture",
    "services/bench",
    "packages/py-schemas",
    "packages/py-audit",
    "packages/py-events",
    "packages/py-llm",
    "packages/py-rules-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", "build", "dist", "_frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "PIE", "RUF", "PL"]
ignore = ["S101", "B008", "S311", "UP042", "PLR0913", "PLR2004", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S", "PLR2004", "ANN"]
"**/conftest.py" = ["S", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/govcon-wfi", "services/rules", "services/capture", "services/bench", "packages"]
addopts = "-q --color=yes --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
