[project]
name = "govcon-workforce-intelligence"
version = "1.0.0"
description = "Contract intelligence + workforce gap analysis for GovCon services firms."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.uv.workspace]
members = [
    "services/govcon-wfi",
    "services/rules",
    "services/capture",
    "services/bench",
    "packages/py-schemas",
    "packages/py-audit",
    "packages/py-events",
    "packages/py-llm",
    "packages/py-rules-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv", "node_modules", "build", "dist", "_frozen",
    # Frozen recruiting services — disconnected from the workspace, retained
    # for reference until the GovCon pivot stabilises.
    "services/screening", "services/outreach", "services/pipeline",
    "services/client-advisory", "services/interview", "services/outcomes",
    "services/market", "services/candidates",
    "apps/candidate-portal",
    # Legacy data package no longer wired into the unified service.
    "packages/py-data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "PIE", "RUF", "PL"]
ignore = ["S101", "B008", "S311", "UP042", "PLR0913", "PLR2004", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S", "PLR2004", "ANN", "E501", "PLC0415"]
"**/conftest.py" = ["S", "ANN"]
# Identifier interpolation in the SQL builder is intentional (asyncpg
# disallows parameterising table/column names) — value substitution still
# uses bound parameters.
"services/govcon-wfi/govcon_wfi/db/pool.py" = ["S608", "PLC0415", "PLW0603"]
"services/govcon-wfi/govcon_wfi/ingestors/upsert.py" = ["S608"]
"services/govcon-wfi/govcon_wfi/deps/audit.py" = ["RUF012", "PLW0603", "PLC0415"]
"services/govcon-wfi/govcon_wfi/embeddings/providers.py" = ["PLW0603", "PLC0415"]
"services/govcon-wfi/govcon_wfi/redis_client.py" = ["PLW0603", "PLC0415"]
"services/govcon-wfi/govcon_wfi/sched/scheduler.py" = ["PLC0415"]
"services/govcon-wfi/govcon_wfi/ingestors/sam_gov.py" = ["PLC0415"]
"services/govcon-wfi/govcon_wfi/ingestors/fpds.py" = ["PLC0415"]
"services/govcon-wfi/govcon_wfi/ingestors/usaspending.py" = ["PLC0415"]
"services/govcon-wfi/govcon_wfi/main.py" = ["E501", "PLC0415"]
"services/govcon-wfi/govcon_wfi/routers/admin.py" = ["PLC0415"]
"services/govcon-wfi/govcon_wfi/routers/contracts.py" = ["PLR0912", "PLR0911"]
"infrastructure/seeds/govcon_seed.py" = ["E501"]
# wfi-schemas defines clearance levels including the "secret" enum value
# which trips the password heuristic; not a real secret.
"packages/py-schemas/wfi_schemas/govcon.py" = ["S105"]
# Pre-existing recruiting/legacy code retained but not actively maintained
# during the GovCon pivot.
"packages/py-schemas/wfi_schemas/candidate.py" = ["S105"]
"packages/py-audit/wfi_audit/client.py" = ["E501", "PLW0603", "PLC0415", "S608"]
"packages/py-events/wfi_events/consumer.py" = ["E501"]
"infrastructure/seeds/synthetic.py" = ["C416", "E501", "PLC0415"]
"services/capture/capture_svc/comp_estimator.py" = ["E501", "RUF002"]
"services/capture/capture_svc/heatmap.py" = ["E501", "E741", "RUF002"]
"services/capture/capture_svc/loi.py" = ["E741"]
"services/rules/rules_svc/main.py" = ["E501"]
"services/rules/tests/test_registry.py" = ["E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/govcon-wfi", "services/rules", "services/capture", "services/bench", "packages"]
addopts = "-q --color=yes --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
