[project]
name = "workforce-intelligence-platform"
version = "0.1.0"
description = "AI-native workforce intelligence operating system."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.uv.workspace]
members = [
    "services/rules",
    "services/screening",
    "services/outreach",
    "services/pipeline",
    "services/client-advisory",
    "services/interview",
    "services/capture",
    "services/outcomes",
    "services/bench",
    "services/market",
    "packages/py-schemas",
    "packages/py-audit",
    "packages/py-events",
    "packages/py-llm",
    "packages/py-rules-sdk",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "PIE", "RUF", "PL"]
ignore = ["S101", "B008", "S311", "UP042", "PLR0913", "PLR2004", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S", "PLR2004", "ANN"]
"**/conftest.py" = ["S", "ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "packages"]
addopts = "-q --color=yes"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
