[project]
name = "wfi-outreach-service"
version = "0.1.0"
description = "Outreach + Close Protection agents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "wfi-schemas",
    "wfi-llm",
    "wfi-audit",
    "wfi-events",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-llm = { workspace = true }
wfi-audit = { workspace = true }
wfi-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outreach_svc"]
