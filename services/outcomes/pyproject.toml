[project]
name = "wfi-outcomes-service"
version = "0.1.0"
description = "Outcome loops + predictive ML — placement success, offer acceptance, recalibration."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "joblib>=1.4",
    "wfi-schemas",
    "wfi-audit",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outcomes_svc"]
