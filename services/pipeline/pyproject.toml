[project]
name = "wfi-pipeline-service"
version = "0.1.0"
description = "Pipeline Manager — multi-req routing, silver medalists, SLA monitoring, ATS sync."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "wfi-schemas",
    "wfi-audit",
    "wfi-events",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-audit = { workspace = true }
wfi-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_svc"]
