[project]
name = "wfi-rules-service"
version = "0.1.0"
description = "FastAPI wrapper around OPA — single API surface for all rules."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "wfi-schemas",
    "wfi-audit",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rules_svc"]
