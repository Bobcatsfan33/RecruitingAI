[project]
name = "wfi-candidates"
version = "0.1.0"
description = "Candidates service: ingest, search, ownership, enrichment."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "wfi-schemas",
    "wfi-data",
    "wfi-events",
    "wfi-audit",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-data = { workspace = true }
wfi-events = { workspace = true }
wfi-audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["candidates_svc"]
