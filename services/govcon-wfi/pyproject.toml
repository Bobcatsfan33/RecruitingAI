[project]
name = "govcon-wfi"
version = "1.0.0"
description = "GovCon Workforce Intelligence — contract intelligence + workforce gap analysis"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pgvector>=0.3.6",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "feedparser>=6.0",
    "wfi-schemas",
    "wfi-audit",
    "wfi-events",
    "wfi-rules-sdk",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-audit = { workspace = true }
wfi-events = { workspace = true }
wfi-rules-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["govcon_wfi"]
