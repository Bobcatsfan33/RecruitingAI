[project]
name = "wfi-client-advisory-service"
version = "0.1.0"
description = "Client Advisory + Client Development agents."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "feedparser>=6.0",
    "wfi-schemas",
    "wfi-llm",
    "wfi-audit",
    "wfi-rules-sdk",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-llm = { workspace = true }
wfi-audit = { workspace = true }
wfi-rules-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["client_advisory_svc"]
