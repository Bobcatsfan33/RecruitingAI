[project]
name = "wfi-bench-service"
version = "0.1.0"
description = "Bench management + compliance — redeployment, clearance, co-employment, conversion fees."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "pydantic-settings>=2.4",
    "wfi-schemas",
    "wfi-rules-sdk",
    "wfi-audit",
]

[tool.uv.sources]
wfi-schemas = { workspace = true }
wfi-rules-sdk = { workspace = true }
wfi-audit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_svc"]
